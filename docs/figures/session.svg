<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 209" role="img" aria-labelledby="title desc">
  <title id="title">Two routes to the course list</title>
  <desc id="desc">An active session returns courses directly. A redirect triggers school sign-in before the lookup resumes.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L9 5L0 10z" fill="#242438" />
    </marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#47405B" stroke-width=".7" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="207" rx="13" fill="#FBFAF7" stroke="#DAD7DD" stroke-width="1.5" />
  <rect x="23" y="28" width="185" height="65" rx="8" fill="#FFFFFF" stroke="#DAD7DD" stroke-width="1.5" />
  <rect x="23" y="38" width="4" height="45" rx="2" fill="#B7A2FF" stroke="none" stroke-width="1.5" />
  <text x="37" y="58" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#242438">Open Canvas</text>
  <text x="37" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#545368">Request courses</text>
  <rect x="413" y="28" width="204" height="65" rx="8" fill="#FFFFFF" stroke="#DAD7DD" stroke-width="1.5" />
  <rect x="413" y="38" width="4" height="45" rx="2" fill="#8EE2BE" stroke="none" stroke-width="1.5" />
  <text x="427" y="58" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#242438">Course list</text>
  <text x="427" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#545368">Names and links</text>
  <path d="M209 66H406" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="308" y="51" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#242438">Active session</text>
  <path d="M113 94V147H180" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="185" y="129" width="265" height="38" rx="19" fill="#FFD387" stroke="none" stroke-width="1.5" />
  <text x="317.5" y="155" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#242438">Complete Duke sign-in</text>
  <path d="M451 148H514V100" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="31" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#545368">Redirected</text>
  <text x="485" y="185" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#545368">Resume</text>
</svg>
