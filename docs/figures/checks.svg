<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" role="img" aria-labelledby="title desc">
  <title id="title">Verification coverage</title>
  <desc id="desc">Live checks cover Chrome and Canvas. Browser fixtures cover application watchers; the click loop uses a simulated model.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L9 5L0 10z" fill="#242438" />
    </marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#47405B" stroke-width=".7" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="252" rx="13" fill="#FBFAF7" stroke="#DAD7DD" stroke-width="1.5" />
  <text x="26" y="39" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">WORKFLOW</text>
  <text x="314" y="39" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">EVIDENCE</text>
  <path d="M25 54H614" fill="none" stroke="#DAD7DD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="27" y="87" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#242438">Shared Chrome</text>
  <circle cx="321" cy="80" r="6" fill="#8EE2BE" />
  <text x="339" y="87" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#242438">Live reconnect</text>
  <path d="M25 101H614" fill="none" stroke="#DAD7DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="27" y="132" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#242438">Duke Canvas</text>
  <circle cx="321" cy="125" r="6" fill="#8EE2BE" />
  <text x="339" y="132" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#242438">Live lookup and repeat</text>
  <path d="M25 146H614" fill="none" stroke="#DAD7DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="27" y="177" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#242438">Model click loop</text>
  <circle cx="321" cy="170" r="6" fill="#B7A2FF" />
  <text x="339" y="177" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#242438">Simulated decisions</text>
  <path d="M25 191H614" fill="none" stroke="#DAD7DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <text x="27" y="222" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start" fill="#242438">Greenhouse &amp; Ashby</text>
  <circle cx="321" cy="215" r="6" fill="#B7A2FF" />
  <text x="339" y="222" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#242438">Browser fixtures</text>
  <path d="M25 236H614" fill="none" stroke="#DAD7DD" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
