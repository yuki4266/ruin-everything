    <path d="M48 60l39 26 41 -6" fill="none" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M86 67l65 16v46l-65 -17Z" fill="#FFF9EE" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M86 67l65 16v9l-65 -16Z" fill="#9CE1BB" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M94 91l39 10m-39 2 26 7" fill="none" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <circle cx="180" cy="166" r="3" fill="#9CE1BB" />
  </g>
  <text x="26" y="49" font-family="Georgia, Times New Roman, serif" font-size="36" font-weight="700" fill="#FFF9EE">Ruin Everything</text>
  <text x="26" y="100" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#FFF9EE">A browser session</text>
  <text x="26" y="135" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#FFF9EE">your next run</text>
  <text x="26" y="170" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#FFF9EE">can pick up.</text>
  <path d="M27 199H282" fill="none" stroke="#786989" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" />
  <text x="26" y="230" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#9CE1BB">CLI → local Chrome</text>
  <text x="26" y="257" font-family="Menlo, monospace" font-size="17" font-weight="500" fill="#EBE5F6">CDP on 127.0.0.1:9222</text>
  <text x="26" y="302" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#FFF9EE">Tabs stay open after the runner exits.</text>
</svg>
