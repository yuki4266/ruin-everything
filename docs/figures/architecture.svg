<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" role="img" aria-labelledby="t d">
  <title id="t">Shared local browser session</title>
  <desc id="d">A workstation cutaway shows mail and form windows inside one Chrome session. A later CLI run can reconnect over the same loopback port.</desc>
  <defs>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#474354" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="330" rx="11" fill="#FFF9EE" stroke="#C6BBC2" stroke-width="1.7" />
  <rect x="1" y="1" width="638" height="330" rx="12" fill="#242238" stroke="none" stroke-width="1.7" />
  <path d="M330 25L626 103v188l-296 -78Z" fill="url(#dots)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  <g transform="translate(316 48) scale(1.08)">
    <path d="M1 163l112 -43 168 57 -115 44Z" fill="url(#dots)" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M67 151v-69l86 24v74l-22 9Z" fill="#7865AA" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
