    <path d="M13 23L39 13l187 42 -24 13Z" fill="#D9CDFF" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M202 68l24 -13v112l-24 15Z" fill="#69568B" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M13 23l189 45v114L13 131Z" fill="#B6A2FF" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M27 41l157 38v78L27 118Z" fill="#242238" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
