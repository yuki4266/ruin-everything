<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" role="img" aria-labelledby="title desc">
  <title id="title">Two tabs, one verification request</title>
  <desc id="desc">The application stays open. The watcher observes a new mail row, validates its message and fills the original tab.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L9 5L0 10z" fill="#242438" />
    </marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#47405B" stroke-width=".7" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="242" rx="13" fill="#FBFAF7" stroke="#DAD7DD" stroke-width="1.5" />
  <text x="27" y="38" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">JOB TAB</text>
  <text x="411" y="38" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">MAIL TAB</text>
  <path d="M60 58V217 M442 58V217" fill="none" stroke="#DAD7DD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="60" cy="83" r="8" fill="#B7A2FF" />
  <circle cx="442" cy="83" r="8" fill="#FFABBA" />
  <path d="M75 83H425" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="102" y="72" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#242438">Code request observed</text>
  <text x="462" y="90" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#242438">New row</text>
  <circle cx="442" cy="145" r="8" fill="#FFABBA" />
  <path d="M425 145H76" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <circle cx="60" cy="145" r="8" fill="#B7A2FF" />
  <text x="103" y="134" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#242438">Matched one code</text>
  <text x="462" y="152" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#242438">Read locally</text>
  <circle cx="60" cy="207" r="8" fill="#8EE2BE" />
  <text x="84" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#242438">Fill → submit → check receipt</text>
</svg>
