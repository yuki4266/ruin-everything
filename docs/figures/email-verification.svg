<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="title desc">
<title id="title">One verification request, two browser tabs</title>
<desc id="desc">The local runner keeps the job form open, reads a matching fresh message from Outlook and checks for a receipt after submitting the code.</desc>
<defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#26756e"/></marker></defs>
<rect width="800" height="240" fill="#fbfcfb"/>
<g font-family="Arial, sans-serif" fill="#233d50">
<text x="24" y="36" font-weight="bold" font-size="23">One verification request, two browser tabs</text>
<rect x="24" y="69" width="230" height="112" rx="5" fill="#eaf1f4" stroke="#8096a4"/>
<rect x="541" y="69" width="235" height="112" rx="5" fill="#deebe7" stroke="#8096a4"/>
<g font-size="18" font-weight="bold"><text x="40" y="102">Greenhouse job tab</text><text x="556" y="102">Outlook inbox</text></g>
<g font-size="15"><text x="40" y="136">Keep the original form open</text><text x="40" y="159">Check for a receipt</text><text x="556" y="136">Match employer and time</text><text x="556" y="159">Check the sender and code</text>
<text x="307" y="91">Challenge detected</text><text x="308" y="166">Fill the code locally</text>
<text x="24" y="217">If the code expires, allow one resend in the same form.</text></g></g>
<g stroke="#26756e" stroke-width="2" marker-end="url(#tip)"><path d="M261 104H532"/><path d="M534 141H263"/></g>
</svg>
