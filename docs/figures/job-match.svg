<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 383" role="img" aria-labelledby="t d">
  <title id="t">Resolving an existing challenge without resend</title>
  <desc id="d">Only a message after the original request that identifies the expected job in its body can be used in this recovery branch.</desc>
  <defs>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#474354" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="381" rx="11" fill="#FFF9EE" stroke="#C6BBC2" stroke-width="1.7" />
  <text x="23" y="50" font-family="Georgia, Times New Roman, serif" font-size="33" font-weight="700" fill="#242238">Two jobs from the same employer</text>
  <rect x="28" y="83" width="592" height="113" rx="5" fill="#242238" stroke="none" stroke-width="1.7" />
  <rect x="24" y="78" width="592" height="113" rx="5" fill="#FFF9EE" stroke="#242238" stroke-width="1.7" />
  <rect x="25" y="79" width="590" height="20" rx="4" fill="#F897A7" stroke="none" stroke-width="1.7" />
  <path d="M24 99h592" fill="none" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  <circle cx="34" cy="89" r="2.3" fill="#242238" />
  <circle cx="44" cy="89" r="2.3" fill="#242238" />
  <circle cx="54" cy="89" r="2.3" fill="#242238" />
  <text x="40" y="132" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#242238">Subject: Security code for your application</text>
  <text x="40" y="165" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#242238">Recovery target: Example Employer · job 42</text>
  <path d="M319 196v20H170v20m149 -20h151v20" fill="none" stroke="#242238" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
  <rect x="24" y="237" width="287" height="91" rx="5" fill="#D7F0DF" stroke="none" stroke-width="1.7" />
  <rect x="331" y="237" width="285" height="91" rx="5" fill="#FFE5B3" stroke="none" stroke-width="1.7" />
  <text x="38" y="269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#242238">Body identifies job 42</text>
  <text x="38" y="301" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#242238">Check code and fields</text>
  <text x="344" y="269" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#242238">Job 43 or no job ID</text>
  <text x="344" y="301" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#242238">Leave form untouched</text>
  <text x="26" y="361" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#242238">Applies to an existing challenge with no resend control.</text>
</svg>
