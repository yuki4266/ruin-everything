<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-labelledby="title desc">
  <title id="title">What counts as submitted</title>
  <desc id="desc">On the original Ashby URL, the visible status must contain both the Success heading and the submission message.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L9 5L0 10z" fill="#242438" />
    </marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#47405B" stroke-width=".7" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="268" rx="13" fill="#FBFAF7" stroke="#DAD7DD" stroke-width="1.5" />
  <rect x="25" y="25" width="590" height="150" rx="8" fill="#FFFFFF" stroke="#DAD7DD" stroke-width="1.5" />
  <rect x="25" y="25" width="8" height="150" rx="4" fill="#8EE2BE" stroke="none" stroke-width="1.5" />
  <text x="50" y="53" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">ASHBY  /  SAME JOB URL</text>
  <text x="50" y="95" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#242438">Success</text>
  <text x="50" y="132" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" text-anchor="start" fill="#242438">Your application was successfully submitted.</text>
  <path d="M316 179V206" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="133" y="212" width="373" height="38" rx="19" fill="#8EE2BE" stroke="none" stroke-width="1.5" />
  <text x="319.5" y="238" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#242438">Store one receipt per job</text>
</svg>
