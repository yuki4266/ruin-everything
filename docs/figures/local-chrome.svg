<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" role="img" aria-labelledby="title desc">
  <title id="title">Reconnect to the original browser</title>
  <desc id="desc">Independent local commands can attach to a single Chrome process and find the existing job tab.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L9 5L0 10z" fill="#242438" />
    </marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#47405B" stroke-width=".7" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="242" rx="13" fill="#FBFAF7" stroke="#DAD7DD" stroke-width="1.5" />
  <text x="24" y="40" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">CLIENT CONNECTIONS</text>
  <text x="384" y="40" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">LOCAL MACHINE</text>
  <rect x="24" y="62" width="232" height="66" rx="8" fill="#FFFFFF" stroke="#DAD7DD" stroke-width="1.5" />
  <rect x="24" y="72" width="4" height="46" rx="2" fill="#B7A2FF" stroke="none" stroke-width="1.5" />
  <text x="38" y="92" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#242438">First command</text>
  <text x="38" y="117" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#545368">Starts or attaches</text>
  <rect x="24" y="153" width="232" height="66" rx="8" fill="#FFFFFF" stroke="#DAD7DD" stroke-width="1.5" />
  <rect x="24" y="163" width="4" height="46" rx="2" fill="#B7A2FF" stroke="none" stroke-width="1.5" />
  <text x="38" y="183" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#242438">Later command</text>
  <text x="38" y="208" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#545368">Attaches again</text>
  <path d="M256 96H284V183H256" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M284 139H338" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <rect x="342" y="60" width="271" height="161" rx="8" fill="#EEE9FF" stroke="#6247BB" stroke-width="1.5" />
  <text x="362" y="99" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#242438">Chrome</text>
  <text x="362" y="127" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="500" text-anchor="start" fill="#6247BB">127.0.0.1:9222</text>
  <rect x="359" y="150" width="235" height="49" rx="8" fill="#FFFFFF" stroke="#DAD7DD" stroke-width="1.5" />
  <circle cx="376" cy="174" r="5" fill="#31A577" />
  <text x="389" y="181" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#242438">Original job tab</text>
</svg>
