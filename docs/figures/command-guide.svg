<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d">
  <title id="t">Choosing the CLI entry point</title>
  <desc id="d">Five starting states map to the Chrome, click, Greenhouse, Ashby and Canvas entry points.</desc>
  <defs>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#474354" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="338" rx="11" fill="#FFF9EE" stroke="#C6BBC2" stroke-width="1.7" />
  <text x="23" y="50" font-family="Georgia, Times New Roman, serif" font-size="33" font-weight="700" fill="#242238">Choose a command</text>
  <text x="24" y="88" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#5B448B">IF YOU HAVE…</text>
  <text x="355" y="88" font-family="Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#5B448B">RUN</text>
  <rect x="21" y="105" width="598" height="41" rx="5" fill="#F2EDE4" stroke="none" stroke-width="1.7" />
  <circle cx="37" cy="125" r="5" fill="#B6A2FF" />
  <text x="51" y="133" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#242238">A local Chrome session to open</text>
  <text x="353" y="133" font-family="Menlo, monospace" font-size="19" font-weight="700" fill="#242238">browser</text>
  <rect x="21" y="150" width="598" height="41" rx="5" fill="#FFF9EE" stroke="none" stroke-width="1.7" />
  <circle cx="37" cy="170" r="5" fill="#B6A2FF" />
  <text x="51" y="178" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#242238">An HTTPS page and a click task</text>
  <text x="353" y="178" font-family="Menlo, monospace" font-size="19" font-weight="700" fill="#242238">"TASK" --site URL</text>
  <rect x="21" y="195" width="598" height="41" rx="5" fill="#F2EDE4" stroke="none" stroke-width="1.7" />
  <circle cx="37" cy="215" r="5" fill="#F897A7" />
  <text x="51" y="223" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#242238">A Greenhouse email challenge</text>
  <text x="353" y="223" font-family="Menlo, monospace" font-size="19" font-weight="700" fill="#242238">verify-email</text>
  <rect x="21" y="240" width="598" height="41" rx="5" fill="#FFF9EE" stroke="none" stroke-width="1.7" />
  <circle cx="37" cy="260" r="5" fill="#9CE1BB" />
  <text x="51" y="268" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#242238">An Ashby form awaiting a receipt</text>
  <text x="353" y="268" font-family="Menlo, monospace" font-size="19" font-weight="700" fill="#242238">resume-ashby</text>
  <rect x="21" y="285" width="598" height="41" rx="5" fill="#F2EDE4" stroke="none" stroke-width="1.7" />
  <circle cx="37" cy="305" r="5" fill="#FFCF73" />
  <text x="51" y="313" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#242238">A Duke course lookup</text>
  <text x="353" y="313" font-family="Menlo, monospace" font-size="19" font-weight="700" fill="#242238">courses</text>
</svg>
