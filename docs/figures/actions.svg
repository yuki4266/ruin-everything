<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 207" role="img" aria-labelledby="title desc">
  <title id="title">What the model sees</title>
  <desc id="desc">The browser exposes a title and labeled controls. A click decision identifies an element in the current snapshot.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L9 5L0 10z" fill="#242438" />
    </marker>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#47405B" stroke-width=".7" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="638" height="205" rx="13" fill="#FBFAF7" stroke="#DAD7DD" stroke-width="1.5" />
  <text x="22" y="37" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">BROWSER</text>
  <text x="440" y="37" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" text-anchor="start" fill="#6247BB">MODEL</text>
  <rect x="24" y="55" width="159" height="125" rx="8" fill="#EEE9FF" stroke="#DAD7DD" stroke-width="1.5" />
  <text x="43" y="91" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#242438">Visible</text>
  <text x="43" y="119" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#242438">controls</text>
  <text x="43" y="152" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="500" text-anchor="start" fill="#6247BB">[1]  [2]  [3]</text>
  <rect x="453" y="55" width="163" height="125" rx="8" fill="#FCE9EB" stroke="#DAD7DD" stroke-width="1.5" />
  <text x="472" y="94" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#242438">Choose</text>
  <text x="472" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#242438">an action</text>
  <text x="472" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#545368">click · done · stop</text>
  <path d="M187 84H444" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="317" y="72" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#242438">Task, title, labels</text>
  <path d="M449 145H190" fill="none" stroke="#242438" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)" />
  <text x="318" y="170" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#242438">Selected control ID</text>
</svg>
