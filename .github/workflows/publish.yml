name: Build and publish Python distributions
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUIN_AUTO_UPDATE: '0'
      RUIN_RULE_UPDATES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set the distribution version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          project = Path("pyproject.toml")
          source = project.read_text()
          base = tomllib.loads(source)["project"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != f"v{base}":
                  raise ValueError("The release tag must match the version in pyproject.toml.")
          else:
              version = base + "." + os.environ["GITHUB_RUN_NUMBER"]
              project.write_text(source.replace(f'version = "{base}"', f'version = "{version}"', 1))
      - run: python -m pip install build twine '.[agent,mcp]'
      # Hosted Ubuntu supplies the shared libraries; browser tests validate them.
      # Avoid an apt transaction for Playwright's extra font packages on every build.
      - name: Install Chromium
        timeout-minutes: 30
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python -m playwright install chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Chromium installation failed after 3 attempts."
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Chromium installation failed (attempt $attempt/3); retrying in ${delay}s."
            sleep "$delay"
          done
      - run: python -m unittest discover -s tests -v
      - run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  registry:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify the manifest matches the release
        run: jq -e --arg v "${GITHUB_REF_NAME#v}" '.version == $v and .packages[0].version == $v' server.json
      - name: Install the official registry publisher
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo publisher.tgz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.8/mcp-publisher_linux_amd64.tar.gz
          echo '09f1fa70ee146b640584274a1a6b2b8a0310b05d4321fa9224e6df6a016d67f4  publisher.tgz' | sha256sum --check
          tar -xzf publisher.tgz mcp-publisher
      - name: Publish the tagged PyPI version to the MCP Registry
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.json
