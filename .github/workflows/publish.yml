name: Build and publish Python distributions
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUIN_AUTO_UPDATE: '0'
      RUIN_RULE_UPDATES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set the distribution version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          project = Path("pyproject.toml")
          source = project.read_text()
          base = tomllib.loads(source)["project"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != f"v{base}":
                  raise ValueError("The release tag must match the version in pyproject.toml.")
          else:
              version = base + "." + os.environ["GITHUB_RUN_NUMBER"]
              project.write_text(source.replace(f'version = "{base}"', f'version = "{version}"', 1))
      - run: python -m pip install build twine '.[agent,mcp]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
      - run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
