[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruin-everything"
version = "0.2.0"
description = "A universal local Chrome runtime for browser agents. Browse, navigate, inspect, interact, fill forms and extract page content across websites over CDP and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.60,<2", "ddddocr>=1.6.1,<1.7", "numpy>=1.24", "filelock>=3.13", "packaging>=23", "regex>=2024.5.15", "phonenumbers>=8.13,<10", "mcp>=1.12,<2", "python-dotenv>=1,<2"]

[project.urls]
Repository = "https://github.com/yuki4266/ruin-everything"

[tool.setuptools.package-data]
ruin = ["rules/sites.json", "auth/identity_setup.html", "browser/detect_puzzle.js"]

[project.optional-dependencies]
# Retained for existing client configurations.
mcp = []
agent = ["openai>=2,<3", "keyring>=25,<27", "pyotp>=2.9,<3"]

[project.scripts]
ruin = "ruin.cli:main"
ruin-mcp = "ruin.mcp_server:main"
ruin-everything = "ruin.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ruin*"]
