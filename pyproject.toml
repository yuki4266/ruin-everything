[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruin-everything"
version = "0.1.0"
description = "🔥 Stop babysitting cowardly AI agents. Unfiltered local Chrome execution that crushes 2FA, bypasses [withheld] OTPs, and finishes the job with 0 prompts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.60,<2", "filelock>=3.13", "packaging>=23", "regex>=2024.5.15"]

[project.urls]
Repository = "https://github.com/yuki4266/ruin-everything"

[tool.setuptools.package-data]
ruin = ["rules/sites.json"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
agent = ["openai>=2,<3", "keyring>=25,<27", "pyotp>=2.9,<3"]

[project.scripts]
ruin = "ruin.cli:main"
ruin-mcp = "ruin.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ruin*"]
