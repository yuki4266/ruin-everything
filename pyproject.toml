[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruin-everything"
version = "0.1.0"
description = "Local browser session runner for Duke Canvas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.60,<2"]

[project.optional-dependencies]
agent = ["openai>=2,<3", "keyring>=25,<27", "pyotp>=2.9,<3"]

[project.scripts]
ruin = "ruin.cli:main"

[tool.setuptools.packages.find]
include = ["ruin*"]
